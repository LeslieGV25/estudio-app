name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build

      - run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze

      - run: flutter test
